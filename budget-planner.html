<!DOCTYPE html>
<html lang="en" data-theme="forest-green">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2D5016" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Budget Planner</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ===========================================================
   THEME VARIABLES
   =========================================================== */
:root[data-theme="forest-green"]{
  color-scheme: light;
  --primary:#2D5016; --primary-2:#3d6b1f;
  --secondary:#C4A69D; --accent:#FFB84D;
  --success:#4CAF50; --warning:#FFC107; --danger:#F44336;
  --bg:#F5F5F5; --surface:#FFFFFF; --surface-2:#EEEEEE;
  --text:#1f2a18; --text-muted:#6a6a6a; --border:#dcdcdc;
  --input-bg:#FFFFFF; --input-text:#1f2a18;
  --shadow:0 2px 6px rgba(0,0,0,.08);
}
:root[data-theme="pastel-pink"]{
  color-scheme: light;
  --primary:#9B7BA1; --primary-2:#7b5e83;
  --secondary:#E8C8D8; --accent:#D4A5D4;
  --success:#88B098; --warning:#E5B8B8; --danger:#D4747B;
  --bg:#F9F4F7; --surface:#FFFFFF; --surface-2:#EDE8EF;
  --text:#3a2c3f; --text-muted:#8b7c91; --border:#e0d3df;
  --input-bg:#FFFFFF; --input-text:#3a2c3f;
  --shadow:0 2px 6px rgba(124,80,128,.10);
}
:root[data-theme="dark-mode"]{
  color-scheme: dark;
  --primary:#6C9FFF; --primary-2:#8fb6ff;
  --secondary:#A855FF; --accent:#00D9FF;
  --success:#4FD884; --warning:#FFD84F; --danger:#FF6B6B;
  --bg:#0F1419; --surface:#1C2135; --surface-2:#2D2E5F;
  --text:#E6ECF7; --text-muted:#8aa0c6; --border:#2c3550;
  --input-bg:#262d44; --input-text:#E6ECF7;
  --shadow:0 4px 14px rgba(0,0,0,.45);
}
/* ===========================================================
   BASE
   =========================================================== */
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
/* layout */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
#sidebar{background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
#sidebar h1{font-size:16px;margin:0 0 18px;color:var(--primary);display:flex;align-items:center;gap:8px;font-weight:700}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:8px;text-align:left;color:var(--text);font-weight:500;margin-bottom:4px}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn.active{background:var(--primary);color:#fff}
.nav-icon{font-size:18px}
#content{padding:24px 28px;min-width:0}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.section-title{font-size:22px;font-weight:700;margin:0;color:var(--text)}
.tab-bar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;flex-wrap:nowrap}
.tab-btn{padding:10px 14px;border-bottom:2px solid transparent;color:var(--text-muted);font-weight:500;white-space:nowrap;background:transparent}
.tab-btn.active{border-color:var(--primary);color:var(--primary)}
.tab-btn:hover{color:var(--text)}
/* cards & grids */
.card{background:var(--surface);border-radius:10px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--border)}
.card h3{margin:0 0 10px;font-size:15px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1024px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
.menu-toggle{display:none;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);font-size:22px;border:1px solid var(--border);color:var(--text)}
#sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#sidebar-backdrop.show{display:block;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#mobile-bottom-nav{display:none}
@media(max-width:768px){
  #app{grid-template-columns:1fr}
  #sidebar{position:fixed;left:-280px;top:0;width:260px;max-width:84vw;z-index:60;transition:left .25s ease;
    padding-top:calc(18px + env(safe-area-inset-top));
    padding-bottom:calc(18px + env(safe-area-inset-bottom));
    box-shadow:6px 0 24px rgba(0,0,0,.25)}
  #sidebar.open{left:0}
  #sidebar h1{font-size:18px}
  .menu-toggle{display:none!important}
  /* Horizontal scroll hint for wide tables */
  [style*="overflow-x:auto"]{
    background:linear-gradient(to right,var(--surface) 30%,rgba(255,255,255,0)),
               linear-gradient(to right,rgba(0,0,0,0),var(--surface) 70%) 100% 0,
               radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.12),rgba(0,0,0,0)),
               radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.12),rgba(0,0,0,0)) 100% 0;
    background-repeat:no-repeat;
    background-size:30px 100%,30px 100%,12px 100%,12px 100%;
    background-attachment:local,local,scroll,scroll;
    -webkit-overflow-scrolling:touch;
  }
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  #content{padding:14px;padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  .section-header{flex-direction:column;align-items:stretch;gap:12px;margin-bottom:14px}
  .section-title{font-size:20px}
  .section-header > div{display:flex;flex-wrap:wrap;gap:6px}
  .section-header .btn{flex:1;justify-content:center;min-width:0}
  .tab-bar{margin-left:-14px;margin-right:-14px;padding:0 14px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .tab-btn{padding:12px 14px;font-size:14px;scroll-snap-align:start;min-height:44px}
  .card{padding:14px;border-radius:12px}
  .card h3{font-size:13px}
  .stat-value{font-size:20px}
  .btn{min-height:40px;padding:10px 14px;font-size:13px}
  .btn-sm{min-height:32px;padding:6px 10px;font-size:12px}
  /* Inputs: 16px font prevents iOS zoom */
  input[type=text],input[type=number],input[type=date],input[type=month],input[type=email],input[type=search],select,textarea{
    font-size:16px;padding:11px 12px;min-height:44px
  }
  label{font-size:11px}
  .form-grid{grid-template-columns:1fr}
  /* Tables: card-stacked layout for horizontally-overflowing content */
  .tbl-stack{display:block}
  .tbl-stack thead{display:none}
  .tbl-stack tbody,.tbl-stack tr{display:block;width:100%}
  .tbl-stack tr{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;padding:10px;border-left-width:4px}
  .tbl-stack td{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border:0;text-align:right;gap:10px;font-size:13px}
  .tbl-stack td::before{content:attr(data-label);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);text-align:left;flex:0 0 auto}
  .tbl-stack td.num{text-align:right}
  .tbl-stack td:empty,.tbl-stack td:has(.empty-state){display:none}
  /* Modal: bottom sheet on mobile */
  .modal-bg{align-items:flex-end;padding:0}
  .modal{border-radius:16px 16px 0 0;max-width:none;max-height:92vh;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:slideup .25s ease}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .modal-actions{position:sticky;bottom:0;background:var(--surface);padding-top:12px;margin-top:18px;border-top:1px solid var(--border)}
  .modal-actions .btn{flex:1;min-width:0;justify-content:center}
  /* Calendar: mobile-friendly */
  .cal-grid{gap:2px}
  .cal-cell{min-height:54px;padding:3px;font-size:10px}
  .cal-cell-num{font-size:11px}
  .cal-evt{font-size:9px;padding:1px 3px}
  .cal-day-name{font-size:10px;padding:2px}
  /* Charts smaller on mobile */
  .chart-wrap{height:220px}
  .chart-wrap.tall{height:280px}
  /* Toasts move up to avoid bottom nav */
  #toast-root{bottom:calc(80px + env(safe-area-inset-bottom));right:10px;left:10px;max-width:none}
  /* Bottom nav for primary sections */
  #mobile-bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:40;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.08)}
  #mobile-bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;padding:6px 4px;color:var(--text-muted);font-size:10px;font-weight:600;border-radius:8px;background:transparent;min-height:50px}
  #mobile-bottom-nav button .ic{font-size:20px;line-height:1}
  #mobile-bottom-nav button.active{color:var(--primary)}
  /* Pills and rows wrap nicely */
  .row{flex-wrap:wrap}
  /* Hide net summary in sidebar bottom (shown elsewhere) - keep though, accessible */
  /* Filter bars stack */
  .filter-bar{flex-direction:column;align-items:stretch}
  .filter-bar input,.filter-bar select{max-width:none!important;width:100%}
  /* Nav button bigger on mobile */
  .nav-btn{padding:13px 14px;min-height:48px;font-size:15px}
}
@media(max-width:480px){
  body{font-size:13px}
  .stat-value{font-size:18px}
  .section-title{font-size:18px}
  .cal-cell{min-height:46px}
  .cal-evt{display:none}
  .cal-cell.has-evt::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
    width:5px;height:5px;border-radius:50%;background:var(--primary)}
  .modal{padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
  #content{padding:12px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(80px + env(safe-area-inset-bottom))}
}
@media(hover:none){
  .tbl tbody tr:hover{background:transparent}
  .nav-btn:hover{background:transparent}
  .nav-btn.active{background:var(--primary)}
  .btn:active{filter:brightness(.95)}
}
/* stats */
.stat{display:flex;flex-direction:column;gap:4px}
.stat-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
.stat-value{font-size:24px;font-weight:700;color:var(--text)}
.stat-sub{font-size:12px;color:var(--text-muted)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;transition:transform .08s,filter .15s;border:1px solid transparent}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-secondary{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.btn-secondary:hover{background:var(--border)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:transparent;color:var(--primary)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:6px}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--text)}
.tbl th.sort-asc::after{content:" ▲";font-size:10px}
.tbl th.sort-desc::after{content:" ▼";font-size:10px}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
/* income/expense rows */
.tx-income{background:color-mix(in srgb,var(--success) 8%,transparent)}
.tx-income td.amt{color:var(--success);font-weight:700}
.tx-expense td.amt{color:var(--text)}
/* inputs */
input[type=text],input[type=number],input[type=date],input[type=month],input[type=email],input[type=search],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;
  background:var(--input-bg);color:var(--input-text);
  transition:border-color .12s,box-shadow .12s
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 25%,transparent)}
/* date picker icon visibility in dark mode */
:root[data-theme="dark-mode"] input[type=date]::-webkit-calendar-picker-indicator,
:root[data-theme="dark-mode"] input[type=month]::-webkit-calendar-picker-indicator{filter:invert(1)}
label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.form-row{margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
/* status pill */
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.pill-success{background:color-mix(in srgb,var(--success) 18%,transparent);color:var(--success)}
.pill-warning{background:color-mix(in srgb,var(--warning) 22%,transparent);color:var(--warning)}
.pill-danger{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.pill-muted{background:var(--surface-2);color:var(--text-muted)}
/* toggle */
.toggle{position:relative;display:inline-block;width:38px;height:22px}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;transition:.2s;cursor:pointer}
.toggle .slider:before{content:"";position:absolute;height:16px;width:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+.slider{background:var(--success);border-color:var(--success)}
.toggle input:checked+.slider:before{transform:translateX(15px)}
/* progress */
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--primary);transition:width .3s}
.progress.warn>span{background:var(--warning)}
.progress.danger>span{background:var(--danger)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--surface);border-radius:12px;padding:22px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 18px 50px rgba(0,0,0,.3);color:var(--text)}
.modal h3{margin:0 0 14px;font-size:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
/* toast */
#toast-root{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{padding:11px 14px;border-radius:8px;background:var(--surface);color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.15);border-left:4px solid var(--primary);animation:slidein .25s}
.toast.success{border-left-color:var(--success)}
.toast.warn{border-left-color:var(--warning)}
.toast.danger{border-left-color:var(--danger)}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day-name{font-size:11px;font-weight:700;color:var(--text-muted);padding:4px;text-align:center;text-transform:uppercase}
.cal-cell{min-height:80px;background:var(--surface-2);border-radius:6px;padding:5px;font-size:11px;border:1px solid var(--border);position:relative;cursor:pointer}
.cal-cell:hover{border-color:var(--primary)}
.cal-cell.muted{opacity:.4}
.cal-cell.today{outline:2px solid var(--primary)}
.cal-cell-num{font-weight:700;font-size:12px;margin-bottom:2px;color:var(--text)}
.cal-evt{display:block;color:#fff;padding:1px 4px;margin-bottom:2px;border-radius:3px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* chart wrap */
.chart-wrap{position:relative;height:240px}
.chart-wrap.tall{height:340px}
/* utilities */
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.muted{color:var(--text-muted)}
.right{text-align:right}
.center{text-align:center}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:var(--surface-2);color:var(--text-muted);margin-right:3px}
.theme-swatch{width:18px;height:18px;border-radius:50%;display:inline-block;border:1px solid var(--border);vertical-align:middle;margin-right:6px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
.empty-state .emoji{font-size:42px;margin-bottom:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.flow-up{color:var(--success)}
.flow-down{color:var(--danger)}
</style>
</head>
<body>

<button class="menu-toggle" id="menuToggle" aria-label="Open menu" style="position:fixed;top:12px;left:12px;z-index:60">☰</button>
<div id="sidebar-backdrop" aria-hidden="true"></div>

<nav id="mobile-bottom-nav" aria-label="Primary">
  <button data-section="transactions" class="active"><span class="ic">💳</span><span>Transactions</span></button>
  <button data-section="dashboards"><span class="ic">📈</span><span>Dashboards</span></button>
  <button data-section="monthly"><span class="ic">🗓️</span><span>Monthly</span></button>
  <button data-section="wealth"><span class="ic">🌱</span><span>Wealth</span></button>
  <button data-section="settings"><span class="ic">⚙️</span><span>Settings</span></button>
</nav>

<div id="app">
  <aside id="sidebar">
    <h1>💰 Budget Planner</h1>
    <nav id="navList">
      <button class="nav-btn active" data-section="transactions"><span class="nav-icon">💳</span>Transactions</button>
      <button class="nav-btn" data-section="dashboards"><span class="nav-icon">📈</span>Dashboards</button>
      <button class="nav-btn" data-section="monthly"><span class="nav-icon">🗓️</span>Monthly</button>
      <button class="nav-btn" data-section="wealth"><span class="nav-icon">🌱</span>Build Wealth</button>
      <button class="nav-btn" data-section="settings"><span class="nav-icon">⚙️</span>Settings</button>
    </nav>
    <div style="margin-top:24px;padding-top:14px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted)">
      <div id="netSummary"></div>
    </div>
  </aside>

  <main id="content"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
"use strict";

/* ============================================================
   STORAGE LAYER
   ============================================================ */
const STORAGE_KEY = "budgetPlanner.v1";

/* Frequency options - lowercase keys for data, capitalized labels for UI */
const FREQUENCIES = [
  {value:"once",         label:"Once"},
  {value:"weekly",       label:"Weekly"},
  {value:"bi-weekly",    label:"Bi-Weekly"},
  {value:"semi-monthly", label:"Semi-Monthly"},
  {value:"monthly",      label:"Monthly"},
  {value:"quarterly",    label:"Quarterly"},
  {value:"custom",       label:"Custom"}
];
const VALID_FREQ_VALUES = FREQUENCIES.map(f=>f.value);
function freqLabel(v){const f=FREQUENCIES.find(x=>x.value===v);return f?f.label:v;}
function freqOptions(selected){
  return FREQUENCIES.map(f=>`<option value="${f.value}" ${selected===f.value?"selected":""}>${f.label}</option>`).join("");
}

/* Currencies — code, symbol, locale, and approximate exchange rate per 1 USD.
   All stored amounts are kept in the base currency (USD, rate=1).
   Display values are computed as stored × rate; input values are stored as input ÷ rate. */
const CURRENCIES = [
  {code:"USD", symbol:"$",   locale:"en-US", name:"US Dollar",            rate:1.00},
  {code:"EUR", symbol:"€",   locale:"de-DE", name:"Euro",                 rate:0.92},
  {code:"GBP", symbol:"£",   locale:"en-GB", name:"British Pound",        rate:0.79},
  {code:"JPY", symbol:"¥",   locale:"ja-JP", name:"Japanese Yen",         rate:150},
  {code:"AUD", symbol:"A$",  locale:"en-AU", name:"Australian Dollar",    rate:1.52},
  {code:"CAD", symbol:"C$",  locale:"en-CA", name:"Canadian Dollar",      rate:1.36},
  {code:"CHF", symbol:"CHF", locale:"de-CH", name:"Swiss Franc",          rate:0.88},
  {code:"CNY", symbol:"¥",   locale:"zh-CN", name:"Chinese Yuan",         rate:7.20},

function fromBase(baseAmount){

/* ============================================================
   DATE UTILITIES (LOCAL TIME — no UTC drift)
   ============================================================ */
/* Parse string "YYYY-MM-DD" or "YYYY-MM" as LOCAL date (avoid UTC interpretation drift). */
function parseDate(s){
  if(s instanceof Date) return new Date(s.getTime());
  if(s==null) return new Date(NaN);
  const str = String(s);
  const m = str.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/);
  if(m){
    const y=Number(m[1]), mo=Number(m[2])-1, d=Number(m[3]||1);
    return new Date(y, mo, d);
  }
  return new Date(str);
}
/* Format a Date to local YYYY-MM-DD (does NOT use toISOString). */
function ymd(d){
  const dt = parseDate(d);
  if(isNaN(dt)) return "";
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
}
function firstOfMonth(d){const x=parseDate(d);x.setDate(1);x.setHours(0,0,0,0);return x;}
function addMonths(d,n){const x=parseDate(d);x.setMonth(x.getMonth()+n);return x;}
function addDays(d,n){const x=parseDate(d);x.setDate(x.getDate()+n);return x;}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function lastDayOfMonth(year, monthIdx){return new Date(year, monthIdx+1, 0).getDate();}

/* Format helpers */
const fmtMoney = (n)=> {
  const baseV = Number(n)||0;
  const cur = getCurrency();
  // JPY, KRW, IDR don't use minor units
  const noDecimals = ["JPY","KRW","IDR"].includes(cur.code);
  const fracDigits = noDecimals ? 0 : 2;
  const display = Math.abs(baseV) * cur.rate;
  const formatted = display.toLocaleString(cur.locale,{minimumFractionDigits:fracDigits,maximumFractionDigits:fracDigits});
  return (baseV<0?"-":"")+cur.symbol+formatted;
};
const fmtPct = (n)=> (Number(n)||0).toFixed(1)+"%";
const fmtDate = (d)=> {
  const dt = parseDate(d);
  if(isNaN(dt)) return "";
  return dt.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
};
const monthLabel = (d)=> {
  const dt = parseDate(d);
  return dt.toLocaleDateString("en-US",{month:"long",year:"numeric"});
};

function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============================================================
   TRANSACTION FREQUENCY EXPANSION
   Returns date occurrences within [from, to], using local-time math.
   Supports: once, weekly, bi-weekly, semi-monthly, monthly, quarterly, custom.
   ============================================================ */
function expandTransaction(tx, from, to){
  const out=[];
  const fromD=parseDate(from), toD=parseDate(to);
  const baseD=parseDate(tx.date);
  if(isNaN(baseD)) return out;
  const freq = tx.type==="recurring" ? (tx.frequency||"monthly") : (tx.frequency||"once");
  if(freq==="once" || tx.type!=="recurring"){
    if(baseD>=fromD && baseD<=toD) out.push(new Date(baseD));
    return out;
  }
  let d=new Date(baseD);
  let safety=0;
  const baseDay = baseD.getDate();
  while(d<=toD && safety<2000){
    if(d>=fromD) out.push(new Date(d));
    switch(freq){
      case "weekly":       d=addDays(d,7); break;
      case "bi-weekly":    d=addDays(d,14); break;
      case "semi-monthly": d=addDays(d,15); break;
      case "monthly":      d=stepMonth(d,1,baseDay); break;
      case "quarterly":    d=stepMonth(d,3,baseDay); break;
      case "custom":
        if(tx.customDays&&Number(tx.customDays)>0) d=addDays(d,Number(tx.customDays));
        else d=stepMonth(d,1,baseDay);
        break;
      default: d=stepMonth(d,1,baseDay);
    }
    safety++;
  }
  return out;
}
function stepMonth(d, monthsToAdd, preferredDay){
  const next = new Date(d.getFullYear(), d.getMonth()+monthsToAdd, 1);
  const lastDay = lastDayOfMonth(next.getFullYear(), next.getMonth());
  next.setDate(Math.min(preferredDay||d.getDate(), lastDay));
  return next;
}

function transactionsInMonth(monthDate){
  const start=firstOfMonth(monthDate);
  const end=addDays(addMonths(start,1),-1);
  const out=[];
  for(const tx of DATA.transactions){
    const dates=expandTransaction(tx,start,end);
    for(const d of dates){
      out.push({...tx,occurrenceDate:ymd(d)});
    }
  }
  return out.sort((a,b)=>parseDate(a.occurrenceDate)-parseDate(b.occurrenceDate));
}

function isIncomeCat(name){

/* ============================================================
   ACCOUNT BALANCE — respects "Balance As Of Date"
   ============================================================ */
function isLiabilityAccount(acc){
  return ACCOUNT_TYPES[acc.type]?.classification==="liability";
}
function computeAccountBalance(accId){
  const acc=DATA.bankAccounts.find(a=>a.id===accId);
  if(!acc) return 0;
  let bal=Number(acc.startingBalance)||0;
  const start=parseDate(acc.balanceAsOfDate||acc.startingDate||"1970-01-01");
  const today=new Date();
  for(const tx of DATA.transactions){
    if(tx.account!==acc.id && tx.account!==acc.name) continue;
    const dates=expandTransaction(tx, start, today);
    for(const d of dates){
      if(tx.isPaid===false) continue;
      const amt=Number(tx.amount)||0;
      if(isIncomeCat(tx.category)) bal+=amt; else bal-=amt;
    }
  }
  return bal;
}

/* Build month-options for filter dropdown */
function monthOptionsForTransactions(){
  const set=new Set();
  for(const t of DATA.transactions){
    const m=ymd(t.date).slice(0,7);
    if(m) set.add(m);
  }
  // include current ± 12 months
  const today=new Date();
  for(let i=-12;i<=12;i++){
    set.add(ymd(addMonths(today,i)).slice(0,7));
  }
  const arr=Array.from(set).sort().reverse();
  return arr.map(m=>{
    const d=parseDate(m+"-01");
    return `<option value="${m}" ${state.txMonthFilter===m?"selected":""}>${d.toLocaleDateString("en-US",{month:"long",year:"numeric"})}</option>`;
  }).join("");
}

function applyMonthFilter(list){
  if(!state.txMonthFilter) return list;
  return list.filter(t=>{
    if(t.type==="recurring"){
      // recurring: include if any occurrence falls in filtered month
      const start=parseDate(state.txMonthFilter+"-01");
      const end=addDays(addMonths(start,1),-1);
      return expandTransaction(t,start,end).length>0;
    }
    return ymd(t.date).slice(0,7)===state.txMonthFilter;
  });
}
function applySort(list){
  const {field,order} = state.txSort;
  const sign = order==="asc"?1:-1;
  return [...list].sort((a,b)=>{
    let av,bv;
    switch(field){
      case "amount": av=Number(a.amount)||0; bv=Number(b.amount)||0; break;
      case "category": av=String(a.category||"").toLowerCase(); bv=String(b.category||"").toLowerCase(); break;
      case "description": av=String(a.description||"").toLowerCase(); bv=String(b.description||"").toLowerCase(); break;
      case "date":
      default: av=parseDate(a.date).getTime()||0; bv=parseDate(b.date).getTime()||0;
    }
    if(av<bv) return -1*sign;
    if(av>bv) return  1*sign;
    return 0;
  });
}
function sortTh(label,field,extraClass=""){
  const cls = state.txSort.field===field ? (state.txSort.order==="asc"?"sort-asc":"sort-desc") : "";
  return `<th class="sortable ${cls} ${extraClass}" data-sort="${field}">${label}</th>`;
}

      <div class="right"><div class="stat-value" style="color:${assets?'var(--text)':'var(--danger)'}">${fmtMoney(Math.abs(bal))}</div><div class="muted" style="font-size:11px">As of ${fmtDate(a.balanceAsOfDate||"-")}</div></div></div>

      <div class="card stat"><span class="stat-label">Total Liabilities</span><span class="stat-value" style="color:var(--danger)">${fmtMoney(totalLiab)}</span></div>
      <div class="card stat"><span class="stat-label">Net Worth</span><span class="stat-value">${fmtMoney(netWorth)}</span></div>
    </div>

      <div class="card"><h3>Asset Distribution</h3><div class="chart-wrap"><canvas id="acctPie"></canvas></div></div>
      <div class="card"><h3>Liability Distribution</h3><div class="chart-wrap"><canvas id="liabPie"></canvas></div></div>
    </div>
    <div class="grid grid-2">
      <div><h3 class="muted" style="font-size:13px;text-transform:uppercase;letter-spacing:.05em">Assets</h3>${accountSection(true)||`<div class="card empty-state">No asset accounts</div>`}</div>
      <div><h3 class="muted" style="font-size:13px;text-transform:uppercase;letter-spacing:.05em">Liabilities</h3>${accountSection(false)||`<div class="card empty-state">No liability accounts</div>`}</div>

function bindTransactions(){
  document.querySelectorAll("[data-tx-tab]").forEach(b=>b.addEventListener("click",()=>{state.txTab=b.dataset.txTab;destroyCharts();render();}));
  document.getElementById("btnExport")?.addEventListener("click",exportCSV);
  document.getElementById("btnImport")?.addEventListener("click",importCSV);

  document.getElementById("btnAddRecurring")?.addEventListener("click",()=>openTxModal({type:"recurring",frequency:"monthly"}));
  document.getElementById("btnAddVariable")?.addEventListener("click",()=>openTxModal({type:"variable",frequency:"once"}));
  document.getElementById("btnAddAccount")?.addEventListener("click",()=>openAccountModal({}));

  // month nav
  document.getElementById("txMonthSelect")?.addEventListener("change",e=>{state.txMonthFilter=e.target.value;destroyCharts();render();});
  document.getElementById("txMonthPrev")?.addEventListener("click",()=>shiftTxMonth(-1));
  document.getElementById("txMonthNext")?.addEventListener("click",()=>shiftTxMonth(1));

  // sort headers
  document.querySelectorAll("th.sortable").forEach(th=>th.addEventListener("click",()=>{
    const f=th.dataset.sort;
    if(state.txSort.field===f) state.txSort.order = state.txSort.order==="asc"?"desc":"asc";
    else { state.txSort.field=f; state.txSort.order=(f==="date"?"desc":"asc"); }
    render();
  }));

  document.querySelectorAll("[data-toggle-paid]").forEach(el=>el.addEventListener("change",e=>{
    const id=el.dataset.togglePaid;
    const tx=DATA.transactions.find(t=>t.id===id);
    if(tx){
      tx.isPaid=e.target.checked;
      if(tx.isPaid) tx.lastPaidDate=ymd(new Date());
      saveData();
      toast(tx.isPaid?"Marked paid":"Marked unpaid","success");
      destroyCharts();render();
    }
  }));
  document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{
    const tx=DATA.transactions.find(t=>t.id===b.dataset.edit);
    if(tx)openTxModal(tx);
  }));
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    if(!confirm("Delete this transaction?"))return;
    DATA.transactions=DATA.transactions.filter(t=>t.id!==b.dataset.del);
    saveData();toast("Deleted","success");destroyCharts();render();
  }));
  document.querySelectorAll("[data-edit-acc]").forEach(b=>b.addEventListener("click",()=>{
    const a=DATA.bankAccounts.find(x=>x.id===b.dataset.editAcc);
    if(a)openAccountModal(a);
  }));
  document.querySelectorAll("[data-del-acc]").forEach(b=>b.addEventListener("click",()=>{
    if(!confirm("Delete account? Linked transactions will keep the reference."))return;
    DATA.bankAccounts=DATA.bankAccounts.filter(a=>a.id!==b.dataset.delAcc);
    saveData();toast("Account deleted","success");destroyCharts();render();
  }));

  // text/category/status/freq filters
  ["fSch","fSchCat","fSchStatus","fSchFreq"].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    el.addEventListener("input",()=>filterScheduleTable());
  });
  ["fVar","fVarCat"].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    el.addEventListener("input",()=>filterVariableTable());
  });

  if(state.txTab==="accounts"){
    drawAccountCharts();
  }
}

function shiftTxMonth(delta){
  const cur = state.txMonthFilter || ymd(new Date()).slice(0,7);
  const d = parseDate(cur+"-01");
  d.setMonth(d.getMonth()+delta);
  state.txMonthFilter = ymd(d).slice(0,7);
  destroyCharts();render();
}

function filterScheduleTable(){
  const q=(document.getElementById("fSch")?.value||"").toLowerCase();
  const cat=document.getElementById("fSchCat")?.value||"";
  const status=document.getElementById("fSchStatus")?.value||"";
  const freq=document.getElementById("fSchFreq")?.value||"";
  document.querySelectorAll("#schTable tbody tr").forEach(tr=>{
    const id=tr.dataset.id;if(!id){return;}
    const tx=DATA.transactions.find(t=>t.id===id);
    if(!tx){tr.style.display="none";return;}
    const matchQ=!q||(tx.description||"").toLowerCase().includes(q)||(tx.category||"").toLowerCase().includes(q);
    const matchCat=!cat||tx.category===cat;
    const matchStatus=!status||(status==="paid"?tx.isPaid:!tx.isPaid);
    const matchFreq=!freq||tx.frequency===freq;
    tr.style.display=(matchQ&&matchCat&&matchStatus&&matchFreq)?"":"none";
  });
}
function filterVariableTable(){
  const q=(document.getElementById("fVar")?.value||"").toLowerCase();
  const cat=document.getElementById("fVarCat")?.value||"";
  document.querySelectorAll("#varTable tbody tr").forEach(tr=>{
    const id=tr.dataset.id;if(!id)return;
    const tx=DATA.transactions.find(t=>t.id===id);
    if(!tx){tr.style.display="none";return;}
    const matchQ=!q||(tx.description||"").toLowerCase().includes(q)||(tx.category||"").toLowerCase().includes(q);
    const matchCat=!cat||tx.category===cat;
    tr.style.display=(matchQ&&matchCat)?"":"none";
  });
}

function drawAccountCharts(){
  const assets={};const liab={};
  for(const a of DATA.bankAccounts){
    const bal=computeAccountBalance(a.id);
    if(isLiabilityAccount(a)) liab[ACCOUNT_TYPES[a.type].label]=(liab[ACCOUNT_TYPES[a.type].label]||0)+Math.abs(bal);
    else assets[ACCOUNT_TYPES[a.type]?.label||a.type]=(assets[ACCOUNT_TYPES[a.type]?.label||a.type]||0)+Math.max(bal,0);
  }
  const ctxA=document.getElementById("acctPie");
  if(ctxA && Object.keys(assets).length){
    state.charts.acctPie=new Chart(ctxA,{type:"doughnut",
      data:{labels:Object.keys(assets),datasets:[{data:Object.values(assets),backgroundColor:["#6C9FFF","#4FD884","#A855FF","#FFD84F","#00D9FF"]}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}});
  }
  const ctxL=document.getElementById("liabPie");
  if(ctxL && Object.keys(liab).length){
    state.charts.liabPie=new Chart(ctxL,{type:"doughnut",
      data:{labels:Object.keys(liab),datasets:[{data:Object.values(liab),backgroundColor:["#FF6B6B","#F44336","#FFB84D","#D4747B"]}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}});
  }
}

function openTxModal(tx){
  const isEdit=!!tx.id;
  const t=Object.assign({type:"variable",isPaid:false,frequency:"monthly",amount:"",date:ymd(new Date()),category:"",subcategory:"",description:"",account:DATA.bankAccounts[0]?.id||""},tx);
  const subcatOptions = (catName)=>{
    const c=DATA.budgetCategories.find(x=>x.name===catName);
    return c?(c.subcategories||[]).map(s=>`<option ${s===t.subcategory?"selected":""}>${escapeHtml(s)}</option>`).join(""):"";
  };
  const html=`
    <h3>${isEdit?"Edit":"Add"} ${t.type==="recurring"?"Fixed":"Variable"} Expense</h3>
    <form>
      <div class="form-grid">
        <div class="form-row"><label>Date</label><input type="date" name="date" value="${t.date}" required></div>
        <div class="form-row"><label>Amount (${getCurrency().code})</label><input type="number" name="amount" step="0.01" min="0" value="${t.amount?fromBaseInput(t.amount):''}" placeholder="0.00" required></div>
      </div>
      <div class="form-row"><label>Description / Name</label><input type="text" name="description" value="${escapeHtml(t.description)}" placeholder="e.g. Rent"></div>
      <div class="form-grid">
        <div class="form-row"><label>Category</label><select name="category" id="txCat" required><option value="">-- Choose --</option>${DATA.budgetCategories.map(c=>`<option ${t.category===c.name?"selected":""}>${escapeHtml(c.name)}</option>`).join("")}</select></div>
        <div class="form-row"><label>Subcategory</label><select name="subcategory" id="txSub"><option value="">-- None --</option>${subcatOptions(t.category)}</select></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>Account</label><select name="account">${DATA.bankAccounts.map(a=>`<option value="${a.id}" ${a.id===t.account?"selected":""}>${escapeHtml(a.name)}</option>`).join("")}</select></div>
        <div class="form-row"><label>Type</label><select name="type"><option value="variable" ${t.type==="variable"?"selected":""}>Variable / One-time</option><option value="recurring" ${t.type==="recurring"?"selected":""}>Recurring (Fixed)</option></select></div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>Frequency</label><select name="frequency">${freqOptions(t.frequency)}</select></div>
        <div class="form-row"><label>Custom Days</label><input type="number" name="customDays" value="${t.customDays||""}" placeholder="if Custom"></div>
      </div>
      <div class="form-row"><label class="row" style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--text)"><input type="checkbox" name="isPaid" ${t.isPaid?"checked":""}> Already paid</label></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        ${isEdit?'<button type="button" class="btn btn-danger" id="modalDel">Delete</button>':""}
        <button type="submit" class="btn btn-primary">${isEdit?"Save":"Create"}</button>
      </div>
    </form>
  `;
  openModal(html,(data)=>{
    if(!data.category){toast("Pick a category","danger");return;}
    const amtDisplay = parseFloat(data.amount);
    if(!isFinite(amtDisplay) || amtDisplay<0){toast("Enter a valid amount","danger");return;}
    const amt = toBase(amtDisplay); // store in base currency (USD)
    if(!VALID_FREQ_VALUES.includes(data.frequency)){toast("Invalid frequency","danger");return;}
    if(!isEdit && data.type==="variable"){
      const dup=DATA.transactions.find(x=>x.type!=="recurring" && Math.abs(Number(x.amount)-amt)<2/getCurrency().rate && Math.abs(parseDate(x.date)-parseDate(data.date))<3*86400000 && x.category===data.category);
      if(dup && !confirm("Similar transaction exists ("+fmtMoney(dup.amount)+" on "+fmtDate(dup.date)+"). Add anyway?"))return;
    }
    const obj={
      id: t.id || uid("tx"),
      date: data.date,
      type: data.type,
      category: data.category,
      subcategory: data.subcategory||"",
      amount: Math.round(amt*100)/100,
      account: data.account,
      description: data.description,
      frequency: data.frequency,
      customDays: Number(data.customDays)||null,
      isPaid: !!data.isPaid,
      paymentMethod: t.paymentMethod||"manual"
    };
    if(isEdit){
      const idx=DATA.transactions.findIndex(x=>x.id===t.id);
      if(idx>=0) DATA.transactions[idx]=obj;
    }else{
      DATA.transactions.push(obj);
    }
    saveData();
    toast(isEdit?"Saved":"Added","success");
    closeModal();destroyCharts();render();
  });
  setTimeout(()=>{
    document.getElementById("txCat")?.addEventListener("change",e=>{
      const c=DATA.budgetCategories.find(x=>x.name===e.target.value);
      const sel=document.getElementById("txSub");
      if(sel){sel.innerHTML=`<option value="">-- None --</option>`+(c?.subcategories||[]).map(s=>`<option>${escapeHtml(s)}</option>`).join("");}
    });
    document.getElementById("modalDel")?.addEventListener("click",()=>{
      if(!confirm("Delete?"))return;
      DATA.transactions=DATA.transactions.filter(x=>x.id!==tx.id);
      saveData();toast("Deleted","success");closeModal();destroyCharts();render();
    });
  },10);
}

function categorySpend(monthDate){
  const txs=transactionsInMonth(monthDate);
  const out={};
  for(const t of txs){
    if(isIncomeCat(t.category)) continue;
    out[t.category]=(out[t.category]||0)+(Number(t.amount)||0);
  }
  return out;
}
function categoryIncome(monthDate){
  const txs=transactionsInMonth(monthDate);
  let total=0;
  for(const t of txs){if(isIncomeCat(t.category)) total+=Number(t.amount)||0;}
  return total;
}

function renderAllInOne(){
  const today=new Date();
  const inc=categoryIncome(today);
  const spend=categorySpend(today);
  const totalSpend=Object.values(spend).reduce((s,v)=>s+v,0);
  const savings=inc-totalSpend;

  const budgetRows = DATA.budgetCategories.filter(c=>c.type!=="income").map(c=>{
    const actual=spend[c.name]||0;
    const budget=Number(c.budgetedAmount)||0;
    const pct=budget>0?(actual/budget*100):0;
    let pillCls="pill-success",progCls="";
    if(pct>=100){pillCls="pill-danger";progCls="danger";}
    else if(pct>=80){pillCls="pill-warning";progCls="warn";}
    return `<tr>
      <td><span class="dot" style="background:${c.color}"></span>${escapeHtml(c.name)}</td>
      <td class="num">${fmtMoney(budget)}</td>
      <td class="num">${fmtMoney(actual)}</td>
      <td class="num"><span class="pill ${pillCls}">${budget?fmtPct(pct):"—"}</span></td>
      <td><div class="progress ${progCls}"><span style="width:${clamp(pct,0,100)}%"></span></div></td>
    </tr>`;
  }).join("");

  const upcoming = [];
  const start=new Date(today);
  const end=addDays(today,14);
  for(const tx of DATA.transactions){
    if(isIncomeCat(tx.category)) continue;
    const dates=expandTransaction(tx,start,end);
    for(const d of dates){
      if(tx.isPaid && tx.type!=="recurring") continue;
      upcoming.push({...tx,when:d});
    }
  }
  upcoming.sort((a,b)=>a.when-b.when);
  const upcomingHtml = upcoming.slice(0,8).map(u=>`
    <div class="row" style="padding:7px 0;border-bottom:1px solid var(--border)">
      <span class="dot" style="background:${categoryColor(u.category)}"></span>
      <div style="flex:1"><div>${escapeHtml(u.description||u.category)}</div><div class="muted" style="font-size:11px">${fmtDate(u.when)}</div></div>
      <div class="right"><b>${fmtMoney(u.amount)}</b></div>
    </div>`).join("") || `<div class="muted">Nothing upcoming</div>`;

  const totalAssets = DATA.bankAccounts.reduce((s,a)=>s+(isLiabilityAccount(a)?0:computeAccountBalance(a.id)),0);
  return `
    <div class="grid grid-4">
      <div class="card stat"><span class="stat-label">Income (this month)</span><span class="stat-value flow-up">${fmtMoney(inc)}</span></div>
      <div class="card stat"><span class="stat-label">Expenses</span><span class="stat-value flow-down">${fmtMoney(totalSpend)}</span></div>
      <div class="card stat"><span class="stat-label">Net Savings</span><span class="stat-value" style="color:${savings>=0?'var(--success)':'var(--danger)'}">${fmtMoney(savings)}</span></div>
      <div class="card stat"><span class="stat-label">Asset Balance</span><span class="stat-value">${fmtMoney(totalAssets)}</span></div>
    </div>
    <div class="grid grid-2">
      <div class="card"><h3>Annual Spending — Top Categories</h3><div class="chart-wrap"><canvas id="dashPie"></canvas></div></div>
      <div class="card"><h3>Last 12 Months</h3><div class="chart-wrap"><canvas id="dashBar"></canvas></div></div>
    </div>

function renderCalendar(){
  if(!state.calMonth) state.calMonth=ymd(firstOfMonth(new Date())).slice(0,7);
  const month=parseDate(state.calMonth+"-01");
  const start=firstOfMonth(month);
  const startDow=(start.getDay()-DATA.weekStart+7)%7;
  const daysInMonth=lastDayOfMonth(month.getFullYear(),month.getMonth());
  const evtsByDay={};
  for(const tx of transactionsInMonth(month)){
    const day=parseDate(tx.occurrenceDate).getDate();
    (evtsByDay[day]=evtsByDay[day]||[]).push(tx);
  }
  const weekStart=DATA.weekStart;
  const dayNames=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const ordered=[...dayNames.slice(weekStart),...dayNames.slice(0,weekStart)];
  const today=new Date();
  let cells="";
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell muted"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const isToday=(d===today.getDate()&&month.getMonth()===today.getMonth()&&month.getFullYear()===today.getFullYear());
    const evts=(evtsByDay[d]||[]).slice(0,4).map(e=>{
      return `<span class="cal-evt" style="background:${categoryColor(e.category)};color:#fff">${isIncomeCat(e.category)?'+':''}${escapeHtml(e.description||e.category)} ${fmtMoney(e.amount)}</span>`;
    }).join("");
    const more=(evtsByDay[d]||[]).length>4?`<span class="muted" style="font-size:10px">+${evtsByDay[d].length-4} more</span>`:"";
    cells+=`<div class="cal-cell ${isToday?"today":""}"><div class="cal-cell-num">${d}</div>${evts}${more}</div>`;
  }
  const weekly=[];
  let weekIdx=0,wkSum=0;
  for(let d=1;d<=daysInMonth;d++){
    const dow=(start.getDay()+(d-1))%7;
    (evtsByDay[d]||[]).forEach(e=>{ if(!isIncomeCat(e.category)) wkSum+=Number(e.amount)||0; });
    if(((dow-weekStart+7)%7)===6 || d===daysInMonth){
      weekly.push({week:++weekIdx,total:wkSum});wkSum=0;
    }
  }
  const monthSpend=Object.values(categorySpend(month)).reduce((s,v)=>s+v,0);
  const monthIncome=categoryIncome(month);
  return `
    <div class="card">
      <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:8px">
        <button class="btn btn-secondary" id="calPrev">‹</button>
        <h3 style="margin:0;color:var(--text);text-transform:none;letter-spacing:0">${monthLabel(month)}</h3>
        <button class="btn btn-secondary" id="calNext">›</button>
        <span class="spacer"></span>
        <label style="margin:0">Week starts:</label>
        <select id="calWeekStart" style="max-width:140px"><option value="0" ${DATA.weekStart===0?"selected":""}>Sunday</option><option value="1" ${DATA.weekStart===1?"selected":""}>Monday</option></select>
      </div>
      <div class="cal-grid">${ordered.map(n=>`<div class="cal-day-name">${n}</div>`).join("")}${cells}</div>
    </div>
    <div class="grid grid-3">
      <div class="card stat"><span class="stat-label">Month Income</span><span class="stat-value flow-up">${fmtMoney(monthIncome)}</span></div>
      <div class="card stat"><span class="stat-label">Month Expenses</span><span class="stat-value flow-down">${fmtMoney(monthSpend)}</span></div>
      <div class="card stat"><span class="stat-label">Remaining</span><span class="stat-value">${fmtMoney(monthIncome-monthSpend)}</span></div>
    </div>
    <div class="card"><h3>Weekly Cumulative Totals</h3>
      <table class="tbl"><thead><tr><th>Week</th><th class="num">Spending</th></tr></thead><tbody>${weekly.map(w=>`<tr><td>Week ${w.week}</td><td class="num">${fmtMoney(w.total)}</td></tr>`).join("")||`<tr><td colspan="2" class="muted center">No data</td></tr>`}</tbody></table>
    </div>`;

/* Calculate paycheck dates in a month, by frequency. */
function calculatePaychecksWithFrequency(year, monthIdx0, frequency, payDay, startDate){
  const start=new Date(year, monthIdx0, 1);
  const end=new Date(year, monthIdx0+1, 0);
  const arr=[];
  const baseStart = startDate ? parseDate(startDate) : start;
  if(frequency==="weekly" || frequency==="bi-weekly"){
    const stepDays = frequency==="weekly"?7:14;
    let d=new Date(baseStart);
    // step forward to first occurrence in or after the month start
    while(d<start) d=addDays(d,stepDays);
    while(d<=end){arr.push(new Date(d)); d=addDays(d,stepDays);}
  } else if(frequency==="semi-monthly"){
    arr.push(new Date(year,monthIdx0,1));
    arr.push(new Date(year,monthIdx0,15));
  } else if(frequency==="monthly"){
    const day=Math.min(Number(payDay)||1, lastDayOfMonth(year,monthIdx0));
    arr.push(new Date(year,monthIdx0,day));
  } else if(frequency==="quarterly"){
    const quarterMonths=[0,3,6,9];
    if(quarterMonths.includes(monthIdx0)){
      const day=Math.min(Number(payDay)||1, lastDayOfMonth(year,monthIdx0));
      arr.push(new Date(year,monthIdx0,day));
    }
  } else if(frequency==="once"){
    if(baseStart>=start && baseStart<=end) arr.push(new Date(baseStart));
  }
  return arr.filter(d=>d>=start && d<=end);
}

function projectPayoff(balance, annualRate, monthlyPay){
  let bal=balance;
  if(monthlyPay<=0||bal<=0) return {months:bal<=0?0:Infinity,totalInterest:0};
  const r=annualRate/100/12;
  let months=0,interest=0;
  while(bal>0 && months<600){
    const i=bal*r;
    const principal=Math.min(bal,monthlyPay-i);
    if(principal<=0) return {months:Infinity,totalInterest:Infinity};
    interest+=i;
    bal-=principal;
    months++;
  }
  return {months,totalInterest:interest};
}

    saveData();toast("Deleted","success");destroyCharts();render();
  }));
  if(state.wealthTab==="debt"){
    const ctx=document.getElementById("debtChart");
    if(ctx && DATA.debts.length){
      const months=Math.min(60,Math.max(...DATA.debts.map(d=>{
        const m=Number(d.currentPayment)||Number(d.minimumPayment)||1;
        return projectPayoff(Number(d.currentBalance)||0,Number(d.interestRate)||0,m).months;
      }),24));
      const labels=[];const lines=[];
      for(let i=0;i<=months;i++) labels.push("M"+i);
      for(const d of DATA.debts){
        const r=(Number(d.interestRate)||0)/100/12;
        const m=Number(d.currentPayment)||Number(d.minimumPayment)||0;
        let bal=Number(d.currentBalance)||0;
        const arr=[bal];
        for(let i=1;i<=months;i++){
          if(bal<=0){arr.push(0);continue;}
          const interest=bal*r;
          bal=Math.max(0,bal-(m-interest));
          arr.push(Math.round(bal*100)/100);
        }
        lines.push({label:d.name,data:arr,borderColor:randColor(d.id),backgroundColor:"transparent",tension:.2});
      }
      state.charts.debtChart=new Chart(ctx,{type:"line",data:{labels,datasets:lines},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}});
    }
    const sc=document.getElementById("strategyCompare");
    if(sc && DATA.debts.length){
      const totalMin=DATA.debts.reduce((s,d)=>s+(Number(d.minimumPayment)||0),0);
      const totalCur=DATA.debts.reduce((s,d)=>s+(Number(d.currentPayment)||d.minimumPayment||0),0);
      const extra=Math.max(0,totalCur-totalMin);
      function simulate(strategy){
        const debts=DATA.debts.map(d=>({...d,bal:Number(d.currentBalance)||0,r:(Number(d.interestRate)||0)/100/12,min:Number(d.minimumPayment)||0}));
        let months=0,interest=0;
        while(debts.some(d=>d.bal>0) && months<600){
          let pool=extra;
          for(const d of debts){
            if(d.bal<=0) continue;
            const i=d.bal*d.r;interest+=i;
            const principal=Math.min(d.bal,d.min-i);
            d.bal-=Math.max(0,principal);
          }
          const sorted=debts.filter(d=>d.bal>0);
          if(strategy==="snowball") sorted.sort((a,b)=>a.bal-b.bal);
          else sorted.sort((a,b)=>b.r-a.r);
          for(const d of sorted){
            if(pool<=0) break;
            const pay=Math.min(d.bal,pool);d.bal-=pay;pool-=pay;
          }
          months++;
        }
        return {months,interest};
      }
      const s=simulate("snowball"),a=simulate("avalanche");
      sc.innerHTML=`
        <table class="tbl"><tr><th></th><th class="num">Months</th><th class="num">Total Interest</th></tr>

  }

  if(state.wealthTab==="networth"){

      if(isLiabilityAccount(a)){liab+=Math.abs(bal);liabData[label]=(liabData[label]||0)+Math.abs(bal);}
      else{assets+=bal;assetData[label]=(assetData[label]||0)+bal;}
    }
    for(const i of DATA.investments){assets+=Number(i.currentValue)||0;assetData["Investment"]=(assetData["Investment"]||0)+(Number(i.currentValue)||0);}
    for(const d of DATA.debts){liab+=Number(d.currentBalance)||0;liabData[d.name]=(liabData[d.name]||0)+(Number(d.currentBalance)||0);}

    const ctxL=document.getElementById("nwLiabPie");
    if(ctxL && Object.keys(liabData).length) state.charts.nwLiabPie=new Chart(ctxL,{type:"doughnut",data:{labels:Object.keys(liabData),datasets:[{data:Object.values(liabData),backgroundColor:["#FF6B6B","#F44336","#FFB84D","#D4747B"]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"}}}});
    const today=new Date();const labels=[],trend=[];
    let nw=assets-liab;

  }

  if(state.wealthTab==="invest"){
    const labels=[];
    let v0=DATA.investments.reduce((s,i)=>s+(Number(i.currentValue)||0),0);

      const v=Number(i.recurringContribution)||Number(i.annualContribution)||0;

    function project(rate){

    {key:"dark-mode",name:"Dark Mode",swatch:"#6C9FFF"}

    <td><select data-cat-type="${c.id}">${["needs","wants","savings","income"].map(t=>`<option ${c.type===t?"selected":""}>${t}</option>`).join("")}</select></td>

      </div>

      <div class="row" style="margin-top:10px"><button class="btn btn-secondary" id="btnAddCat">+ Add Category</button><span class="spacer"></span><button class="btn btn-secondary" id="saveCats">Save Categories</button></div>

        <button class="btn btn-secondary" id="btnExportJ">Export JSON (backup)</button>
        <button class="btn btn-secondary" id="btnImportJ">Import JSON</button>
        <button class="btn btn-danger" id="btnReset">🗑️ Clear All Data</button>
      </div>
      <div class="muted" style="margin-top:10px;font-size:12px">Storage usage: ~${Math.round(JSON.stringify(DATA).length/1024)} KB</div>

function bindSettings(){
  document.querySelectorAll("input[name=theme]").forEach(r=>r.addEventListener("change",()=>{
    setTheme(r.value);saveData();
  }));
  document.getElementById("saveSettings")?.addEventListener("click",()=>{
    const v=document.getElementById("setBudgetStart").value;
    if(/^\d{4}-\d{2}$/.test(v)){
      DATA.budgetStartMonth=v+"-01";
    }
    DATA.budgetStrategy=document.getElementById("setStrategy").value;
    const curSel=document.getElementById("setCurrency")?.value;
    if(curSel && CURRENCIES.some(c=>c.code===curSel)) DATA.currency=curSel;
    saveData();toast("Saved","success");destroyCharts();render();
  });
  document.getElementById("btnAddCat")?.addEventListener("click",()=>{
    DATA.budgetCategories.push({id:uid("cat"),name:"New Category",type:"wants",color:"#888",budgetedAmount:0,subcategories:[]});
    saveData();render();
  });
  document.getElementById("saveCats")?.addEventListener("click",()=>{
    let invalidCount=0;
    for(const c of DATA.budgetCategories){
      const n=document.querySelector(`[data-cat-name="${c.id}"]`);
      if(n)c.name=n.value;
      const t=document.querySelector(`[data-cat-type="${c.id}"]`);
      if(t)c.type=t.value;
      const col=document.querySelector(`[data-cat-color="${c.id}"]`);
      if(col)c.color=col.value;
      const b=document.querySelector(`[data-cat-budget="${c.id}"]`);
      if(b){
        const v=b.value;
        if(v===""||v==null){c.budgetedAmount=0;}
        else{
          const num=parseFloat(v);
          if(isFinite(num) && num>=0){
            c.budgetedAmount = Math.round(toBase(num)*100)/100;
          }else{
            invalidCount++;
            // do NOT clear stored value
          }
        }
      }
      const s=document.querySelector(`[data-cat-subs="${c.id}"]`);
      if(s)c.subcategories=s.value.split(",").map(x=>x.trim()).filter(Boolean);
    }
    saveData();
    if(invalidCount>0) toast(`Saved (${invalidCount} invalid budget value${invalidCount>1?"s":""} ignored)`,"warn");
    else toast("Categories saved","success");
    render();
  });
  document.querySelectorAll("[data-del-cat]").forEach(b=>b.addEventListener("click",()=>{
    if(!confirm("Delete category? Existing transactions keep their category text."))return;
    DATA.budgetCategories=DATA.budgetCategories.filter(c=>c.id!==b.dataset.delCat);
    saveData();render();
  }));
  document.getElementById("btnExportS")?.addEventListener("click",exportCSV);
  document.getElementById("btnImportS")?.addEventListener("click",importCSV);
  document.getElementById("btnExportJ")?.addEventListener("click",exportJSON);
  document.getElementById("btnImportJ")?.addEventListener("click",importJSON);
  document.getElementById("btnReset")?.addEventListener("click",()=>{
    if(!confirm("Clear ALL data? This cannot be undone."))return;
    if(!confirm("Are you absolutely sure?"))return;
    localStorage.removeItem(STORAGE_KEY);
    DATA=defaultData();
    setTheme(DATA.currentTheme);
    saveNow();toast("Cleared","success");render();
  });
}

/* ============================================================
   THEME
   ============================================================ */
function setTheme(name){
  document.documentElement.setAttribute("data-theme",name);
  DATA.currentTheme=name;
  saveData();
  destroyCharts();
  if(state.section) render();
}
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#888";
}
function randColor(seed){
  let h=0;for(let i=0;i<String(seed).length;i++) h=(h*31+String(seed).charCodeAt(i))&0xffffffff;
  return `hsl(${Math.abs(h)%360},65%,55%)`;
}

/* ============================================================
   CSV / JSON IMPORT EXPORT
   ============================================================ */
function csvEscape(v){
  const s = (v==null?"":String(v));
  if(/[,"\n\r]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function parseCSVLine(line){
  const out=[];let cur="";let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i],n=line[i+1];
    if(c==='"' && n==='"'){cur+='"';i++;}
    else if(c==='"'){inQ=!inQ;}
    else if(c===',' && !inQ){out.push(cur);cur="";}
    else cur+=c;
  }
  out.push(cur);
  return out;
}
function downloadFile(content, filename, mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),100);
}
function exportCSV(){
  const headers=["Date","Type","Category","Sub-Category","Amount","Account","Description","Status","Frequency"];
  const rows = DATA.transactions.map(t=>{
    const acc=DATA.bankAccounts.find(a=>a.id===t.account);
    return [
      t.date,
      t.type==="recurring"?"Fixed":"Variable",
      t.category,
      t.subcategory||"",
      Number(t.amount).toFixed(2),
      acc?acc.name:(t.account||""),
      t.description||"",
      t.isPaid?"Paid":"Unpaid",
      freqLabel(t.frequency||"once")
    ].map(csvEscape).join(",");
  });
  const csv = [headers.join(","), ...rows].join("\r\n");
  downloadFile(csv, `budget-planner-export-${ymd(new Date())}.csv`, "text/csv;charset=utf-8");
  toast("CSV exported","success");
}
function importCSV(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".csv,text/csv";
  inp.addEventListener("change",e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const text=String(r.result||"").replace(/^﻿/,"").trim();
        if(!text){toast("Empty file","danger");return;}
        const lines=text.split(/\r?\n/);
        const headers=parseCSVLine(lines[0]).map(s=>s.trim().toLowerCase());
        const idx=(name)=>headers.indexOf(name);
        const required=["date","amount","category"];
        for(const h of required){
          if(idx(h)<0){toast("CSV missing required column: "+h,"danger");return;}
        }
        const newTx=[];
        for(let i=1;i<lines.length;i++){
          if(!lines[i].trim()) continue;
          const v=parseCSVLine(lines[i]);
          const tx={
            id:uid("tx"),
            date:v[idx("date")]||ymd(new Date()),
            type:(v[idx("type")]||"").toLowerCase()==="fixed"?"recurring":"variable",
            category:v[idx("category")]||"",
            subcategory:idx("sub-category")>=0?v[idx("sub-category")]||"":"",
            amount:parseFloat(v[idx("amount")])||0,
            account: (function(){const name=idx("account")>=0?v[idx("account")]||"":""; const a=DATA.bankAccounts.find(x=>x.name===name); return a?a.id:(DATA.bankAccounts[0]?.id||"");})(),
            description:idx("description")>=0?v[idx("description")]||"":"",
            isPaid:idx("status")>=0?(v[idx("status")]||"").toLowerCase()==="paid":false,
            frequency:idx("frequency")>=0?(v[idx("frequency")]||"once").toLowerCase().replace(/-/g,"-"):"once"
          };
          if(!VALID_FREQ_VALUES.includes(tx.frequency)){
            // try title-case match
            const m = FREQUENCIES.find(f=>f.label.toLowerCase()===tx.frequency.toLowerCase());
            tx.frequency = m?m.value:"once";
          }
          newTx.push(tx);
        }
        if(!confirm(`Import ${newTx.length} transactions? They'll be added to your existing data.`))return;
        DATA.transactions = DATA.transactions.concat(newTx);
        saveNow();toast(`Imported ${newTx.length} transactions`,"success");destroyCharts();render();
      }catch(err){toast("Import error: "+err.message,"danger");}
    };
    r.readAsText(f);
  });
  inp.click();
}
function exportJSON(){
  downloadFile(JSON.stringify(DATA,null,2), `budget-planner-backup-${ymd(new Date())}.json`, "application/json");
  toast("JSON exported","success");
}
function importJSON(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.addEventListener("change",e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!d.transactions||!d.bankAccounts){toast("Invalid file","danger");return;}
        if(!confirm("Replace all current data with imported file?"))return;
        DATA=Object.assign(defaultData(),d);
        saveNow();setTheme(DATA.currentTheme);toast("Imported","success");render();
      }catch(err){toast("Parse error: "+err.message,"danger");}
    };
    r.readAsText(f);
  });
  inp.click();
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  setTheme(DATA.currentTheme||"forest-green");
  // Chart.js global defaults: format axis ticks + tooltips with current currency.
  // All chart data is in base (USD); fmtMoney converts via the user's selected rate.
  if(window.Chart){
    try{
      Chart.defaults.scales.linear.ticks.callback = function(value){ return fmtMoney(value); };
      Chart.defaults.scales.linear.beginAtZero = true;
      Chart.defaults.plugins.tooltip.callbacks.label = function(ctx){
        const lbl = ctx.dataset?.label || "";
        let v;
        if(ctx.parsed && typeof ctx.parsed === "object"){
          v = ctx.parsed.y ?? ctx.parsed.r ?? ctx.parsed.x ?? 0;
        }else{
          v = ctx.parsed ?? ctx.raw ?? 0;
        }
        return (lbl?lbl+": ":"")+fmtMoney(v);
      };
    }catch(e){console.warn("Chart defaults setup failed",e);}
  }
  document.querySelectorAll(".nav-btn").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.section)));
  document.querySelectorAll("#mobile-bottom-nav button").forEach(b=>b.addEventListener("click",()=>navigate(b.dataset.section)));
  document.getElementById("menuToggle")?.addEventListener("click",()=>{
    const open=document.getElementById("sidebar").classList.contains("open");
    if(open) closeSidebar(); else openSidebar();
  });
  document.getElementById("sidebar-backdrop")?.addEventListener("click",closeSidebar);
  // ESC closes sidebar/modal
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){
      if(document.querySelector("#modal-root .modal-bg")) closeModal();
      else closeSidebar();
    }
  });
  // Re-render on viewport change to swap chart sizes
  let resizeTimer=null;
  window.addEventListener("resize",()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{Object.values(state.charts).forEach(c=>{try{c.resize()}catch(e){}});},200);
  });
  render();
}
init();
</script>
